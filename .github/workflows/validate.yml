name: Validate extension

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate manifest
        run: python -m json.tool manifest.json > /dev/null

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in background.js core.js storage.js content.js import.js notion.js popup.js; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Run unit tests
        run: node --test tests/*.test.js
